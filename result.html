<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Among Us-Style Multiplayer Game</title>
    <script src="https://unpkg.com/peerjs@1.4.7/dist/peerjs.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            color: #fff;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #lobby-screen, #game-screen, #settings-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.5s ease;
        }

        #lobby-screen {
            background: rgba(10, 10, 30, 0.9);
        }

        .screen-content {
            max-width: 800px;
            width: 90%;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(255, 105, 180, 0.7);
        }

        .room-code {
            font-size: 2rem;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            margin: 20px 0;
            letter-spacing: 3px;
            font-weight: bold;
            backdrop-filter: blur(5px);
        }

        button {
            background: linear-gradient(45deg, #ff416c, #ff4b2b);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            border-radius: 50px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(255, 75, 43, 0.6);
        }

        button:disabled {
            background: #666;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .player-list {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(5px);
        }

        .player-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px;
            margin: 10px 0;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .player-color {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            margin-right: 15px;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }

        .setting-group {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }

        input[type="range"] {
            width: 100%;
            margin: 10px 0;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: none;
            background: rgba(255, 255, 255, 0.1);
            color: white;
        }

        #map-preview {
            width: 300px;
            height: 200px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            margin: 20px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
        }

        #game-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
        }

        .meeting-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
        }

        .dialogue-box {
            background: rgba(30, 30, 60, 0.95);
            padding: 20px;
            border-radius: 15px;
            margin: 10px;
            max-width: 500px;
            text-align: left;
            border: 1px solid rgba(255, 105, 180, 0.3);
        }

        .dialogue-name {
            font-weight: bold;
            color: #ff6b9d;
            margin-bottom: 5px;
        }

        #voting-screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .vote-option {
            margin: 15px;
            padding: 15px 30px;
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.1);
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .vote-option:hover {
            background: rgba(255, 105, 180, 0.3);
            transform: scale(1.05);
        }

        @media (max-width: 768px) {
            .settings-grid {
                grid-template-columns: 1fr;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .room-code {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <!-- Lobby Screen -->
        <div id="lobby-screen">
            <div class="screen-content">
                <h1>AMONG US STYLE GAME</h1>
                <div class="room-code" id="room-code">ROOM CODE</div>
                <button id="create-room-btn">CREATE ROOM</button>
                <button id="join-room-btn">JOIN ROOM</button>
                
                <div class="player-list">
                    <h2>Players</h2>
                    <div id="players-list"></div>
                </div>
                
                <button id="start-game-btn" disabled>START GAME</button>
                <button id="settings-btn">GAME SETTINGS</button>
            </div>
        </div>

        <!-- Settings Screen -->
        <div id="settings-screen" style="display: none;">
            <div class="screen-content">
                <h1>GAME SETTINGS</h1>
                
                <div class="settings-grid">
                    <div class="setting-group">
                        <label for="map-select">MAP:</label>
                        <select id="map-select">
                            <option value="skeld">The Skeld</option>
                            <option value="mira">Mira HQ</option>
                            <option value="polus">Polus</option>
                            <option value="airship">Airship</option>
                        </select>
                        
                        <label for="player-count">PLAYERS: <span id="player-count-value">4</span></label>
                        <input type="range" id="player-count" min="4" max="15" value="4">
                        
                        <label for="impostor-count">IMPOSTORS: <span id="impostor-count-value">1</span></label>
                        <input type="range" id="impostor-count" min="1" max="3" value="1">
                    </div>
                    
                    <div class="setting-group">
                        <label for="ai-enabled">AI PLAYERS:</label>
                        <input type="checkbox" id="ai-enabled" checked>
                        <label for="ai-enabled">Enable AI Players</label>
                        
                        <label for="ai-count">AI Count: <span id="ai-count-value">0</span></label>
                        <input type="range" id="ai-count" min="0" max="11" value="0">
                        
                        <label for="ai-impostor">AI as Impostors:</label>
                        <input type="checkbox" id="ai-impostor" checked>
                    </div>
                </div>
                
                <button id="back-btn">BACK TO LOBBY</button>
                <button id="apply-settings-btn">APPLY SETTINGS</button>
            </div>
        </div>
        
        <!-- Game Screen -->
        <div id="game-screen">
            <canvas id="game-canvas"></canvas>
            
            <div class="meeting-overlay" id="meeting-overlay">
                <div class="dialogue-box" id="dialogue-box">
                    <div class="dialogue-name" id="dialogue-name">Player Name</div>
                    <div id="dialogue-text">Dialog text will appear here...</div>
                </div>
                <button id="next-dialogue-btn">NEXT</button>
            </div>
            
            <div id="voting-screen">
                <h2>VOTING</h2>
                <div id="voting-options"></div>
            </div>
        </div>
    </div>

    <script>
        // Game state management
        const gameState = {
            room: null,
            peer: null,
            isHost: false,
            playerId: null,
            players: [],
            settings: {
                map: 'skeld',
                totalPlayers: 4,
                impostors: 1,
                aiPlayers: 0,
                aiImpostors: true,
                aiEnabled: true
            },
            currentScreen: 'lobby'
        };

        // DOM Elements
        const elements = {
            lobby: document.getElementById('lobby-screen'),
            game: document.getElementById('game-screen'),
            settings: document.getElementById('settings-screen'),
            roomCode: document.getElementById('room-code'),
            playersList: document.getElementById('players-list'),
            createRoomBtn: document.getElementById('create-room-btn'),
            joinRoomBtn: document.getElementById('join-room-btn'),
            startGameBtn: document.getElementById('start-game-btn'),
            settingsBtn: document.getElementById('settings-btn'),
            backBtn: document.getElementById('back-btn'),
            applySettingsBtn: document.getElementById('apply-settings-btn'),
            playerCountSlider: document.getElementById('player-count'),
            playerCountValue: document.getElementById('player-count-value'),
            impostorCountSlider: document.getElementById('impostor-count'),
            impostorCountValue: document.getElementById('impostor-count-value'),
            aiCountSlider: document.getElementById('ai-count'),
            aiCountValue: document.getElementById('ai-count-value'),
            aiEnabledCheckbox: document.getElementById('ai-enabled'),
            aiImpostorCheckbox: document.getElementById('ai-impostor'),
            mapSelect: document.getElementById('map-select'),
            meetingOverlay: document.getElementById('meeting-overlay'),
            dialogueBox: document.getElementById('dialogue-box'),
            dialogueName: document.getElementById('dialogue-name'),
            dialogueText: document.getElementById('dialogue-text'),
            nextDialogueBtn: document.getElementById('next-dialogue-btn'),
            votingScreen: document.getElementById('voting-screen'),
            votingOptions: document.getElementById('voting-options')
        };

        // Initialize game
        function initGame() {
            setupEventListeners();
            generateRoomCode();
        }

        // Set up event listeners
        function setupEventListeners() {
            elements.createRoomBtn.addEventListener('click', createRoom);
            elements.joinRoomBtn.addEventListener('click', joinRoom);
            elements.startGameBtn.addEventListener('click', startGame);
            elements.settingsBtn.addEventListener('click', showSettings);
            elements.backBtn.addEventListener('click', showLobby);
            elements.applySettingsBtn.addEventListener('click', applySettings);
            
            // Slider updates
            elements.playerCountSlider.addEventListener('input', updatePlayerCount);
            elements.impostorCountSlider.addEventListener('input', updateImpostorCount);
            elements.aiCountSlider.addEventListener('input', updateAiCount);
            
            // Checkboxes
            elements.aiEnabledCheckbox.addEventListener('change', toggleAiEnabled);
            elements.aiImpostorCheckbox.addEventListener('change', toggleAiImpostors);
            
            // Map change
            elements.mapSelect.addEventListener('change', () => {
                gameState.settings.map = elements.mapSelect.value;
            });
            
            // Meeting interactions
            elements.nextDialogueBtn.addEventListener('click', nextDialogue);
        }

        // Update UI based on slider values
        function updatePlayerCount() {
            const value = elements.playerCountSlider.value;
            elements.playerCountValue.textContent = value;
            gameState.settings.totalPlayers = parseInt(value);
            updateImpostorMax();
        }

        function updateImpostorCount() {
            const value = elements.impostorCountSlider.value;
            elements.impostorCountValue.textContent = value;
            gameState.settings.impostors = parseInt(value);
        }

        function updateAiCount() {
            const value = elements.aiCountSlider.value;
            elements.aiCountValue.textContent = value;
            gameState.settings.aiPlayers = parseInt(value);
        }

        function updateImpostorMax() {
            const maxImpostors = Math.min(3, parseInt(elements.playerCountSlider.value) - 1);
            elements.impostorCountSlider.max = maxImpostors;
            if (parseInt(elements.impostorCountSlider.value) > maxImpostors) {
                elements.impostorCountSlider.value = maxImpostors;
                updateImpostorCount();
            }
        }

        function toggleAiEnabled() {
            gameState.settings.aiEnabled = elements.aiEnabledCheckbox.checked;
        }

        function toggleAiImpostors() {
            gameState.settings.aiImpostors = elements.aiImpostorCheckbox.checked;
        }

        // Generate a unique room code
        function generateRoomCode() {
            // Simple room code generation (in a real game, this would be more robust)
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            let code = '';
            for (let i = 0; i < 6; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            gameState.room = code;
            elements.roomCode.textContent = code;
        }

        // Create a new game room
        function createRoom() {
            gameState.isHost = true;
            gameState.playerId = 'host-' + Math.random().toString(36).substr(2, 9);
            gameState.players = [{
                id: gameState.playerId,
                name: 'You',
                isHost: true,
                color: getColor()
            }];
            
            updatePlayersList();
            showLobby();
            elements.startGameBtn.disabled = false;
        }

        // Join an existing room
        function joinRoom() {
            // In a real implementation, this would prompt user for room code
            const roomCode = prompt('Enter room code:');
            if (roomCode) {
                gameState.isHost = false;
                gameState.playerId = 'player-' + Math.random().toString(36).substr(2, 9);
                
                // Simulate joining a room
                gameState.players = [{
                    id: gameState.playerId,
                    name: 'You',
                    isHost: false,
                    color: getColor()
                }];
                
                updatePlayersList();
                showLobby();
                elements.startGameBtn.disabled = false;
            }
        }

        // Start the game
        function startGame() {
            // Validate settings before starting game
            if (gameState.settings.aiPlayers + 1 > gameState.settings.totalPlayers) {
                alert('Not enough players for AI players.');
                return;
            }
            
            showGame();
            
            // Initialize game state variables
            initGameState();
            initPeerJS();
            initCanvas();
        }

        // Initialize the game canvas
        function initCanvas() {
            const canvas = document.getElementById('game-canvas');
            const ctx = canvas.getContext('2d');
            
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            
            // Draw game map representation
            drawGameMap(ctx);
            
            // Simulate player movement
            requestAnimationFrame(updateGame);
        }

        // Draw basic game map representation
        function drawGameMap(ctx) {
            // Clear canvas
            ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            
            // Background
            ctx.fillStyle = '#1a1a2e';
            ctx.fillRect(0, 0, ctx.canvas.width, ctx.canvas.height);
            
            // Draw some rooms
            const rooms = [
                { x: 100, y: 100, width: 150, height: 100, color: '#d81b60' },
                { x: 300, y: 100, width: 120, height: 120, color: '#3949ab' },
                { x: 500, y: 100, width: 100, height: 100, color: '#00897b' },
                { x:
